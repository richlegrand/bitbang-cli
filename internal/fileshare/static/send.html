<!DOCTYPE html>
<html>
<head>
    <title>{{ filename }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        .filename { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; word-break: break-all; }
        .size { color: #666; margin-bottom: 1.5rem; }
        .download-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .download-btn:hover { background: #0056b3; }
        .download-btn:disabled { background: #6c757d; cursor: default; }
        .branding {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #999;
        }
        .branding a { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">{{ icon }}</div>
        <div class="filename">{{ filename }}</div>
        <div class="size" id="size-display">{{ size }}</div>
        <a href="download" target="download-frame" class="download-btn" id="download-btn">Download</a>
        <iframe name="download-frame" id="download-frame" hidden></iframe>
        <div class="branding">
            Shared via <a href="https://bitba.ng">BitBang</a><br>
            P2P &middot; Encrypted &middot; No account
        </div>
    </div>
    <script>
        // The link is the download: the browser's download manager saves it
        // as it arrives, under the name in Content-Disposition. This page
        // used to read it into memory first, so a file had to fit in the tab.
        //
        // It navigates a hidden frame rather than using <a download>, which
        // Chromium sends straight to the network, skipping the service worker
        // -- so it reached bitba.ng instead of the device. A navigation goes
        // through the worker, and Content-Disposition: attachment makes it a
        // download.
        //
        // The href gets the /__device__/<sid> prefix that xhr-shim puts on
        // fetch() paths, because a navigation names no frame the service
        // worker could look its device up by. Without script the bare
        // "download" still works, with the worker inferring the device --
        // which is right unless two are open.
        (function() {
            const sid = window.__bbSessionId;
            if (!sid) return;
            const u = new URL('download', location.href);
            if (u.pathname.indexOf('/__device__/') === 0) return;
            document.getElementById('download-btn').href =
                '/__device__/' + sid + u.pathname + u.search;
        })();

        // A download leaves the frame empty; a page in it is the listener
        // refusing, which would otherwise be invisible.
        document.getElementById('download-frame').addEventListener('load', function() {
            let text = '';
            try {
                text = (this.contentDocument.body.textContent || '').trim();
            } catch (e) {}
            if (text) alert('Failed to download file: ' + text);
        });
    </script>
</body>
</html>
